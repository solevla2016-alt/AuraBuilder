# Раздача собранного фронтенда и проксирование Control Plane.
#
# Ключевое решение: редактор и API живут на одном домене (localhost:8080).
# Если отдавать их с разных источников, браузерная политика CORS
# заставит приложение делать предзапросы на каждый запрос, а cookies
# с сессией придётся делать SameSite=None — это отключает защиту от
# CSRF в браузере. Один домен снимает и то, и другое.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Заголовки безопасности (ТЗ п.7.7). CSP здесь сознательно строгий:
    # внешние ресурсы в приложении запрещены п.10.1, поэтому в списке
    # нет ни одного внешнего хоста. style-src нужен из-за inline-стилей
    # Konva (холст рисуется через атрибуты, но Konva ставит и inline
    # стили слоёв), а 'unsafe-inline' для скриптов — нет.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # Служебная точка для healthcheck: не отдаёт файл, поэтому всегда
    # дешёвая, в отличие от проверки index.html с чтением диска.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Файлы сборки с хешем в имени — на год. Без этого nginx отдаёт
    # их с проверкой каждый раз, и кеш браузера не спасает от
    # лишних запросов на главной странице.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Шрифты лежат в public/fonts и тоже иммутабельны: имя файла не
    # содержит хеша, но файл меняется только при смене версии шрифта,
    # вместе с которым меняется и сборка.
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API: /api/* отдаёт Django. Прокси нужно и для продакшена (в хосте
    # параметры раскрывать не нужно) и для разработки (Vite проксирует
    # сам, но при сборке и предпросмотре проксирует уже nginx).
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Экспорт и синхронизация могут считаться дольше, чем обычный
        # запрос; стандартные 60 секунд nginx обрывают их слишком рано.
        proxy_read_timeout 300s;
        client_max_body_size 25m;
    }

    # Админка Django раздаёт свою статику через whitenoise, но путь
    # /static остаётся на самом Django: там собирается в static_root.
    location /static/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    # SPA: любой неизвестный путь отдаёт index.html, иначе перезагрузка
    # страницы редактора даёт 404. Исключение для API уже выше — иначе
    # несуществующий адрес API отвечал бы HTML вместо ошибки.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Скрытые файлы (включая .env, если он когда-либо попадёт в образ)
    # недоступны снаружи: такой запрос отдаёт 404, а не содержимое.
    location ~ /\. {
        deny all;
        return 404;
    }
}